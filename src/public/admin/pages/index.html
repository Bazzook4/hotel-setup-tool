<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Pages | OnlineHotelier Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="hidden">
  <main>
    <div class="page-head">
      <div>
        <h1>Pages</h1>
        <p class="muted" id="sync-note">Every page on the site and whether it is live. Click a page to see its changes.</p>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <section>
      <div class="filters">
        <input type="search" id="a-search" placeholder="Search title or path…">
        <select id="a-type"><option value="">All types</option></select>
        <select id="a-cat"><option value="">All categories</option></select>
        <select id="a-live">
          <option value="">Any live status</option>
          <option value="live" selected>Live</option>
          <option value="notlive">Not live</option>
        </select>
        <select id="a-changed">
          <option value="">Changed any time</option>
          <option value="1">Changed in last 24 hours</option>
          <option value="7">Changed in last 7 days</option>
          <option value="30">Changed in last 30 days</option>
          <option value="90">Changed in last 90 days</option>
        </select>
        <select id="a-problem">
          <option value="">All current pages</option>
          <option value="checks">Failing checks</option>
          <option value="unlisted">Not listed</option>
          <option value="removed">Removed pages</option>
        </select>
      </div>
      <p class="muted small" id="a-count"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th></th><th>Page</th><th>Type</th><th>Added</th><th>Last changed</th><th>Live</th><th>Listed in</th><th>Checks</th></tr></thead>
          <tbody id="all-rows"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
        </table>
      </div>
      <p class="muted small">Listed in: S = sitemap, N = guide menu (guide-nav.js), G = /guides/ page. Guides need all three.</p>
    </section>
  </main>

  <script src="/admin/js/core.js"></script>
  <script src="/admin/js/tracker.js"></script>
  <script src="/admin/js/pages.js"></script>
</body>
</html>
