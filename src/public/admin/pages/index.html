<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Pages | OnlineHotelier Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="hidden">
  <main>
    <div class="page-head">
      <div>
        <h1>Pages</h1>
        <p class="muted" id="sync-note">Every page on the site, what changed, and whether it is live.</p>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="tabs" role="tablist">
      <button type="button" class="active" data-tab="recent">Recent changes</button>
      <button type="button" data-tab="all">All pages</button>
    </div>

    <section id="tab-recent">
      <div class="filters">
        <select id="r-days">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
          <option value="365">Last 12 months</option>
        </select>
        <select id="r-type">
          <option value="">All changes</option>
          <option value="added">Added</option>
          <option value="modified">Edited</option>
          <option value="deleted">Removed</option>
          <option value="renamed">Moved</option>
        </select>
        <select id="r-live">
          <option value="">Any live status</option>
          <option value="not_live">Not live</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>When</th><th>Page</th><th>Change</th><th>What changed</th><th>Commit</th><th>Live</th></tr></thead>
          <tbody id="recent-rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>

    <section id="tab-all" class="hidden">
      <div class="filters">
        <input type="search" id="a-search" placeholder="Search title or path…">
        <select id="a-type"><option value="">All types</option></select>
        <select id="a-cat"><option value="">All categories</option></select>
        <select id="a-problem">
          <option value="">All current pages</option>
          <option value="notlive">Not live</option>
          <option value="checks">Failing checks</option>
          <option value="unlisted">Not listed</option>
          <option value="removed">Removed pages</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Page</th><th>Type</th><th>Added</th><th>Last changed</th><th>Live</th><th>Listed in</th><th>Checks</th></tr></thead>
          <tbody id="all-rows"></tbody>
        </table>
      </div>
      <p class="muted small">Listed in: S = sitemap, N = guide menu (guide-nav.js), G = /guides/ page. Guides need all three.</p>
    </section>
  </main>

  <script src="/admin/js/core.js"></script>
  <script src="/admin/js/tracker.js"></script>
  <script src="/admin/js/pages.js"></script>
</body>
</html>
